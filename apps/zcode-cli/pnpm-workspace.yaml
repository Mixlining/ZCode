packages:
  - "packages/*"
  - "tools/*"
  - "../../packages/formal-proof"
  - "../../packages/model-option-map"
  - "../../packages/provider"
  - "../../packages/provider-node"
  - "../../packages/shared"
  - "../../packages/zcode-cua"
nodeLinker: hoisted
minimumReleaseAge: 0

supportedArchitectures:
  os:
    - current
    - darwin
    - linux
    - win32
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc

overrides:
  # 与根 workspace 同口径：避免 MCP 2.4.0 的嵌套 zod 4.6.5 与工作区 4.6.7
  # 产生 StandardSchema/ZodRawShape 双重类型。contracts 的 zod 3 不受影响。
  "@modelcontextprotocol/client>zod": 4.6.7
  "@modelcontextprotocol/core>zod": 4.6.7
  "@modelcontextprotocol/server>zod": 4.6.7
