packages:
  - "packages/*"
  - "tools/*"
  - "../../packages/formal-proof"
  - "../../packages/model-option-map"
  - "../../packages/provider"
  - "../../packages/provider-node"
  - "../../packages/shared"
  - "../../packages/zcode-cua"
nodeLinker: hoisted
minimumReleaseAge: 0

supportedArchitectures:
  os:
    - current
    - darwin
    - linux
    - win32
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc

allowBuilds:
  esbuild: set this to true or false
  koffi: set this to true or false
  protobufjs: set this to true or false
  unsafe-pointer: set this to true or false
