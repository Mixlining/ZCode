packages:
  - apps/dev-docs
  - packages/*
  - apps/zcode-cli
  - apps/zcode-cli/packages/*
  - apps/zcode-cli/tools/*
nodeLinker: hoisted
minimumReleaseAge: 0
supportedArchitectures:
  os:
    - current
    - darwin
    - linux
    - win32
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
allowBuilds:
  cpu-features: true
  edgedriver: true
  electron: true
  electron-winstaller: true
  esbuild: true
  geckodriver: true
  koffi: true
  msw: true
  node-pty: true
  protobufjs: true
  ssh2: true
  unsafe-pointer: true
overrides:
  "@electron/rebuild>node-abi": 4.40.0
  electron-to-chromium: 1.5.477
  react: 19.3.1
  react-dom: 19.3.1
  # MCP 2.4.0 的 ^4.2.0 在旧 lockfile 中仍解析到 4.6.5，导致其 StandardSchema
  # 类型与工作区 zod 4.6.7 的 zod/v4 类型不兼容。只对这些包收口，保留 contracts 的 zod 3。
  "@modelcontextprotocol/client>zod": 4.6.7
  "@modelcontextprotocol/core>zod": 4.6.7
  "@modelcontextprotocol/server>zod": 4.6.7
patchedDependencies:
  "@aiden0z/pptx-renderer@1.2.4": patches/@aiden0z__pptx-renderer@1.2.4.patch
  "@arms/rum-electron@0.0.3": patches/@arms__rum-electron@0.0.3.patch
  "@extend-ai/react-xlsx@0.16.0": patches/@extend-ai__react-xlsx@0.16.0.patch
  "@radix-ui/react-collapsible@1.1.12": patches/@radix-ui__react-collapsible@1.1.12.patch
  "@ai-sdk/openai-compatible@2.0.60": patches/@ai-sdk__openai-compatible@2.0.60.patch
  "@ai-sdk/anthropic@3.0.81": patches/@ai-sdk__anthropic@3.0.81.patch
  "vitest@4.1.7": patches/vitest@4.1.7.patch
  "wdio-electron-service@9.2.1": patches/wdio-electron-service@9.2.1.patch
