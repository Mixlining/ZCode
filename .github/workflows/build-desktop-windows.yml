name: Build Desktop (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      # 只有 production 才得到 "ZCode" 身份与不带 _TEST 后缀的产物名。
      ZCODE_ENV: production
      # Windows 安装包不嵌入 mock-cdn 远端资产；远程工作区在运行时按 CDN 拉取。
      ZCODE_SKIP_REMOTE_ASSETS: "1"
      ZCODE_TARGET_OS: win32
      ZCODE_TARGET_ARCH: x64
      # 与 mise.toml 的 [env] 保持一致，直接从 Electron 官方 GitHub Releases 下载二进制。
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      # 缓存目录收进工作区（仓库 .gitignore 已预留这三个目录名）。
      ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up toolchain from mise.toml
        uses: jdx/mise-action@v4

      - name: Point pnpm store into the workspace
        run: pnpm config set store-dir "${{ github.workspace }}/.pnpm-store"

      # 只恢复不保存：Windows store 由默认分支的 warm-windows-caches.yml 独占写入，
      # 否则每个 tag 都会存一份同 key 的重复副本，顶穿仓库缓存上限。
      - name: Restore pnpm store
        uses: actions/cache/restore@v6
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('mise.toml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Restore Electron and electron-builder caches
        id: electron-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .electron-cache
            .electron-builder-cache
          key: electron-${{ runner.os }}-${{ hashFiles('packages/desktop/package.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (root)
        run: pnpm typecheck

      - name: Typecheck Desktop Main (no emit)
        run: pnpm exec tsc -p packages/desktop/tsconfig.main.json --noEmit --pretty false

      - name: Lint (root)
        run: pnpm lint

      - name: Write .env from repository variables (optional)
        shell: pwsh
        env:
          REPO_VAR_ZCODE_BASE_URL: ${{ vars.ZCODE_BASE_URL }}
          REPO_VAR_ZCODE_CDN_BASE_URL: ${{ vars.ZCODE_CDN_BASE_URL }}
          REPO_VAR_ZCODE_REMOTE_ASSET_CDN_BASE_URL: ${{ vars.ZCODE_REMOTE_ASSET_CDN_BASE_URL }}
          REPO_VAR_ZCODE_DEPS_BASE_URL: ${{ vars.ZCODE_DEPS_BASE_URL }}
        run: |
          $mapping = [ordered]@{
            ZCODE_BASE_URL                  = $env:REPO_VAR_ZCODE_BASE_URL
            ZCODE_CDN_BASE_URL              = $env:REPO_VAR_ZCODE_CDN_BASE_URL
            ZCODE_REMOTE_ASSET_CDN_BASE_URL = $env:REPO_VAR_ZCODE_REMOTE_ASSET_CDN_BASE_URL
            ZCODE_DEPS_BASE_URL             = $env:REPO_VAR_ZCODE_DEPS_BASE_URL
          }
          $lines = foreach ($key in $mapping.Keys) {
            if ($mapping[$key]) { "$key=$($mapping[$key])" }
          }
          if ($lines) {
            $lines | Set-Content -Path .env -Encoding utf8
            Write-Host "已写入 .env：$($lines -join '; ')"
          } else {
            Write-Host "未配置 repository variable，使用仓库内置默认端点。"
          }

      - name: Build Windows desktop installer
        id: desktop-build
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $packagePath = Join-Path $env:GITHUB_WORKSPACE "package.json"
          $originalPackageBytes = $null
          $buildExitCode = 0

          try {
            if ($env:REF_TYPE -eq "tag") {
              if ($env:REF_NAME -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
                throw "Desktop release tag '$env:REF_NAME' must use stable vX.Y.Z format."
              }

              $originalPackageBytes = [System.IO.File]::ReadAllBytes($packagePath)
              $package = [System.IO.File]::ReadAllText($packagePath) | ConvertFrom-Json
              $package.version = $env:REF_NAME.Substring(1)
              $updatedPackageJson = $package | ConvertTo-Json -Depth 100
              [System.IO.File]::WriteAllText(
                $packagePath,
                "$updatedPackageJson`n",
                [System.Text.UTF8Encoding]::new($false)
              )
              Write-Host "Using release tag version $($package.version) for the Desktop build."
            } elseif ($env:REF_TYPE -eq "branch") {
              Write-Host "Using the checked-out package.json version for this branch build."
            } else {
              throw "Unsupported Git ref type '$env:REF_TYPE'."
            }

            pnpm run bundle:desktop -- --os win --arch x64
            $buildExitCode = $LASTEXITCODE
          } finally {
            if ($null -ne $originalPackageBytes) {
              [System.IO.File]::WriteAllBytes($packagePath, $originalPackageBytes)
              Write-Host "Restored the checked-out package.json after the Desktop build."
            }
          }

          if ($buildExitCode -ne 0) {
            exit $buildExitCode
          }

      - name: Verify packaged Desktop runtime imports
        run: node packages/desktop/scripts/bundle.mjs --verify-only --os win --arch x64

      # 冷启动降级路径：默认分支条目缺失或被淘汰时，让该 tag 的重跑不必重新下载。
      # 稳态下应被精确命中跳过。
      - name: Save Electron and electron-builder caches
        if: ${{ !cancelled() && steps.desktop-build.outcome != 'skipped' && steps.electron-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            .electron-cache
            .electron-builder-cache
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}

      - name: Collect installer and checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem packages/desktop/dist/*.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "未找到安装包：packages/desktop/dist/*.exe" }
          Write-Host "产物：$($exe.Name)（$([math]::Round($exe.Length / 1MB, 1)) MB）"
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" |
            Set-Content packages/desktop/dist/SHA256SUMS.txt -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: zcode-desktop-windows-x64
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish prerelease (tag runs only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = @(Get-ChildItem packages/desktop/dist/*.exe,
            packages/desktop/dist/SHA256SUMS.txt | ForEach-Object FullName)
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "ZCode Desktop $tag" `
              --prerelease --generate-notes
          }
