name: Check

# 只做静态检查，不产出任何可分发产物：每次 push 与 PR 并行跑四项仓库根已有的检查命令；
# Desktop Main 的无输出检查跟随根 Typecheck，复用其上游声明。
# 与 build-desktop-windows.yml（tag 触发、出 Windows 安装包）互不依赖，打 tag 不触发本工作流。
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      # 四项检查各自上报状态：一项失败不取消其余项，一次就能看全。
      fail-fast: false
      matrix:
        include:
          - name: Typecheck
            command: pnpm typecheck
          - name: Lint
            command: pnpm lint
          - name: Format
            command: pnpm fmt:check
          - name: Architecture
            command: pnpm architecture:check

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up toolchain from mise.toml
        uses: jdx/mise-action@v4

      - name: Point pnpm store into the workspace
        run: pnpm config set store-dir "${{ github.workspace }}/.pnpm-store"

      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@v6
        with:
          # 同一 OS 的矩阵 job 复用一个 store；各 job 安装后显式保存，key 已存在时自动跳过。
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        id: install
        # 静态检查不需要原生二进制与 Electron：跳过安装脚本可免去 Electron 二进制（约 344MB）
        # 下载与 ubuntu 上的 electron-rebuild，单个 job 的安装从数分钟降到十几秒。
        # 各 workspace 包的 exports 直接指向 src/*.ts，检查只读源码，不依赖任何构建产物。
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Save pnpm store
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.pnpm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .pnpm-store
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

      - name: Run check
        run: ${{ matrix.command }}

      - name: Typecheck Desktop Main (no emit)
        if: matrix.name == 'Typecheck'
        run: pnpm exec tsc -p packages/desktop/tsconfig.main.json --noEmit --pretty false
